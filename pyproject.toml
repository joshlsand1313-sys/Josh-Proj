[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudtrail-report"
version = "0.1.0"
description = "CloudTrail management-event audit reports via the LookupEvents API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34,<2",
    "click>=8.1,<9",
    "jinja2>=3.1,<4",
]

[project.scripts]
ct-report = "cloudtrail_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cloudtrail_report = ["templates/*.j2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
web = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths  = ["tests"]
